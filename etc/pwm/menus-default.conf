#
# PWM menus: copy to /usr/local/etc/pwm/menus-default.conf once PWM is installed
#  $ cp /sync/pub/src/devenv/src/config/menus-default.conf /usr/local/etc/pwm/menus-default.conf
# Get PWM from https://github.com/protocolocon/pwm.git
#

menu "exit_menu", "Exit" {
	entry "Restart", "restart"
	entry "Restart TWM", "restart_other", "twm"
	entry "Restart WMaker", "restart_other", "wmaker"
	entry "Restart OLWM", "restart_other", "olwm"
	entry "Exit", "exit"
}


menu "root_menu", "Root Menu" {
        entry "alacriTTY", "exec", "alacritty -o \"window.dimensions.columns=160\" -o \"window.dimensions.lines=43\" -o \"window.position.x=2560\" -o \"window.position.y=0\""
        entry "XTERM", "exec", "xterm -bg black -fg orange -fa \"Ubuntu Mono\" -fs 12"
	entry "xterm blue", "exec", "xterm -bg black -fg cyan"
	entry "xfce4_term", "exec", "xfce4-terminal"
	entry "xterm orange", "exec", "xterm -bg black -fg orange"
	submenu "exit_menu"
}


menu "frame_cwin_menu", "Frame/ClientWin Ops" {
	contextual
	# client window ops
	entry "Close", "close"
        # entry "Tg tagged", "toggle_tagged"

	# frame ops
	entry "Tg shade", "toggle_shade"
	entry "Tg stick", "toggle_stick"
	entry "Tg maximize", "toggle_maximize", 3

	# Put this far from close to prevent accidental kill
	entry "Kill", "kill"

	entry "Detach", "detach"
	submenu "attach_menu"

	submenu "movetows_menu"
}


menu "dockwin_menu", "DockWin Ops" {
	contextual
	entry "Tg Dir", "toggle_dock_dir"
	entry "Close", "close"
	entry "Kill", "kill"
}
